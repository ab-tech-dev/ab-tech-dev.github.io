name: Deploy public site to native VPS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this tested main-branch release to the VPS
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify static entry and package public files only
        run: |
          test -s dist/client/index.html
          tar -czf public-site.tar.gz -C dist/client .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-site
          path: public-site.tar.gz
          retention-days: 7
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production-public-site
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: public-site
      - env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_SSH_KEY" && test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes public-site.tar.gz "site-deploy@$VPS_HOST:/srv/ab-tech-dev/incoming/$RELEASE_SHA.tar.gz"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "site-deploy@$VPS_HOST" "/usr/local/bin/site-release $RELEASE_SHA"
